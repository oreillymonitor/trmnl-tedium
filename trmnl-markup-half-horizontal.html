<!-- HALF HORIZONTAL VIEW (v14 - Linter Optimized) -->
<div class="layout layout--row p--0 1bit:bg--white lg:bg--white bg--red-40" style="height: 100%;">
  
  <!-- 1. STANDARD HARDWARE (OG/Color) -->
  <div class="lg:hidden flex flex--row h--full w--full" style="position: relative;">
    <div class="hidden 1bit:block bg--white" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>
    
    <!-- Image Side (50%) -->
    <div class="w--[50cqw] h--full overflow--hidden no-shrink bg--black" style="position: relative; z-index: 1;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
      <div class="flex flex--col gap--small" style="position: absolute; bottom: 10px; left: 10px; z-index: 2;">
        <img src="{{ logo_url }}" class="image image-dither w--12 h--12 bg--white p--1" style="border: 1px solid black;" />
        <img src="{{ qr_url }}" class="image w--12 h--12 bg--white p--1" style="border: 1px solid black;" />
      </div>
    </div>

    <!-- Text Side (50%) -->
    <div class="w--[50cqw] h--full no-shrink p--4 flex flex--col flex--align-start justify--top text--left" style="position: relative; z-index: 1;">
      <!-- COLOR TEXT (White on Crimson) -->
      <div class="1bit:hidden flex flex--col flex--align-start w--full text--left">
        <div class="text--white" style="font-family: serif; font-style: italic; font-weight: bold; opacity: 0.9; margin-bottom: 4px; width: 100%;">{{ archive_date }}</div>
        <div class="title title--medium text--white text--left w--full" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px;">{{ title }}</div>
        <div class="description description--large text--white text--left w--full mt--2" style="font-family: serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
      </div>
      <!-- MONOCHROME TEXT (Black on White) -->
      <div class="hidden 1bit:flex flex--col flex--align-start w--full text--left">
        <div class="text--black" style="font-family: serif; font-style: italic; font-weight: bold; opacity: 0.8; margin-bottom: 4px; width: 100%;">{{ archive_date }}</div>
        <div class="title title--medium text--black text--left w--full" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
        <div class="description description--large text--black text--left w--full mt--2" style="font-family: serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- 2. TRMNL X HARDWARE (lg) -->
  <div class="hidden lg:flex flex--row h--full w--full bg--white">
    <!-- Image Side (50%) -->
    <div class="w--[50cqw] h--full overflow--hidden no-shrink bg--black" style="position: relative;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
      <div class="flex gap--medium" style="position: absolute; bottom: 15px; left: 15px; z-index: 2;">
        <img src="{{ logo_url }}" class="image image-dither w--24 h--24 bg--white p--1" style="border: 1px solid black;" />
        <img src="{{ qr_url }}" class="image w--24 h--24 bg--white p--1" style="border: 1px solid black;" />
      </div>
    </div>
    <!-- Text Side (50%) -->
    <div class="w--[50cqw] h--full no-shrink p--8 flex flex--col flex--align-start justify--top text--left">
      <div class="text--black" style="font-family: serif; font-style: italic; font-weight: bold; opacity: 0.9; margin-bottom: 6px; width: 100%;">{{ archive_date }}</div>
      <div class="title title--xxlarge text--black text--left w--full mt--2" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid black; padding-top: 8px;">{{ title }}</div>
      <div class="description description--xxlarge text--black text--left w--full mt--3" style="font-family: serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
    </div>
  </div>

</div>
