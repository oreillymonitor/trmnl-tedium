<!-- HALF HORIZONTAL VIEW (Refined) -->
<div class="layout layout--row bg--white p--0" style="height: 100%;">
  <!-- Image: Occupies 50% of the screen -->
  <div class="w--[50cqw] h--full overflow--hidden">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
  </div>

  <!-- Content: Occupies the other 50% -->
  <div class="flex flex--col grow p--4 justify--between" style="height: 100%;">
    <div class="flex flex--col" style="text-align: left;">
      <!-- Title -->
      <div class="title title--medium text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1;">{{ title }}</div>
      
      <!-- Date: Positioned between title and description -->
      <div class="label label--tiny text--black" style="margin: 8px 0; opacity: 0.7; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px; letter-spacing: 1px;">{{ archive_date }}</div>
      
      <!-- Description: Full display, no truncation -->
      <div class="description description--base text--black" style="line-height: 1.3;">{{ description }}</div>
    </div>

    <!-- Branding: Centered logo and QR code -->
    <div class="flex flex--row flex--center gap--medium mt--2" style="width: 100%;">
      <img src="{{ logo_url }}" class="image image-dither w--14 h--14" style="border: 1px solid rgba(0,0,0,0.1);" />
      <img src="{{ qr_url }}" class="image w--14 h--14" style="border: 1px solid rgba(0,0,0,0.1);" />
    </div>
  </div>
</div>
