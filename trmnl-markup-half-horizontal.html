<!-- HALF HORIZONTAL VIEW (50/50 Split with Color Support) -->
<div class="layout layout--row bg--white p--0" style="height: 100%;">
  
  <!-- Image Column (50%) -->
  <div class="w--[50cqw] h--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    <div style="position: absolute; bottom: 8px; left: 8px; display: flex; flex-direction: column; gap: 8px; z-index: 2;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- Content Column (50%) - COLOR VERSION (Hidden on 1bit) -->
  <div class="w--[50cqw] h--full flex flex--col p--4 lg:p--8 justify--top no-shrink 1bit:hidden" style="background-color: #D65A62;">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <div class="lg:title--large" style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: white; opacity: 0.9; margin-bottom: 4px;">{{ archive_date }}</div>
      <div class="title title--medium lg:title--xxlarge" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; color: white; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px;">{{ title }}</div>
      <div class="description description--large lg:description--xxlarge" style="font-family: serif; font-style: italic; line-height: 1.3; color: white; margin-top: 10px;">{{ description }}</div>
    </div>
  </div>

  <!-- Content Column (50%) - MONOCHROME VERSION (Visible on 1bit) -->
  <div class="w--[50cqw] h--full flex flex--col p--4 lg:p--8 justify--top no-shrink hidden 1bit:flex" style="background-color: white;">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <div class="lg:title--large" style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: black; opacity: 0.8; margin-bottom: 4px;">{{ archive_date }}</div>
      <div class="title title--medium lg:title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
      <div class="description description--large lg:description--xxlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3; margin-top: 10px;">{{ description }}</div>
    </div>
  </div>

</div>
