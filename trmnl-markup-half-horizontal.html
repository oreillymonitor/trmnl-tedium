<!-- HALF HORIZONTAL VIEW (v12 - Hybrid Editorial) -->
<div class="layout layout--row bg--white p--0" style="height: 100%; border: 1px solid rgba(0,0,0,0.1); position: relative;">
  
  <!-- 
    STANDARD HARDWARE LAYOUT (Full-Bleed Poster)
    - Shown on standard screens
    - Hidden on TRMNL X (lg)
  -->
  <div class="lg:hidden h--full w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />

    <!-- Editorial Box Overlay -->
    <div class="flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 15px;">
      
      <!-- COLOR BOX (Muted Crimson) -->
      <div class="1bit:hidden" style="background-color: rgba(214, 90, 98, 0.9); width: 85%; padding: 12px 20px; border: 1px solid rgba(255,255,255,0.3);">
        <div class="flex flex--col grow" style="text-align: left;">
          <div class="title title--large" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1; margin-bottom: 5px;">{{ title }}</div>
          <div class="description description--large" style="color: white; line-height: 1.25;">{{ description | truncate: 120 }}</div>
          <div style="text-align: right; width: 100%; margin-top: 5px;">
            <span class="label label--base" style="color: white; opacity: 0.9; font-family: serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
          </div>
        </div>
      </div>

      <!-- MONOCHROME BOX (High-Contrast White) -->
      <div class="hidden 1bit:block" style="background-color: rgba(255, 255, 255, 0.95); width: 85%; padding: 12px 20px; border: 3px solid black;">
        <div class="flex flex--col grow" style="text-align: left;">
          <div class="title title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; margin-bottom: 5px;">{{ title }}</div>
          <div class="description description--large text--black" style="line-height: 1.25;">{{ description | truncate: 120 }}</div>
          <div style="text-align: right; width: 100%; margin-top: 8px;">
            <span class="label label--base text--black" style="opacity: 0.9; font-family: serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Branding Overlay -->
    <div style="position: absolute; bottom: 10px; left: 10px; display: flex; gap: 10px; align-items: center; z-index: 3;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12" style="background: white; padding: 1px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12" style="background: white; padding: 1px; border: 1px solid black;" />
    </div>
  </div>

  <!-- 
    TRMNL X HARDWARE LAYOUT (50/50 Optimized Split)
    - Hidden by default
    - Visible ONLY on TRMNL X (lg)
  -->
  <div class="hidden lg:flex flex--row h--full w--full">
    <!-- Left: Image (50%) -->
    <div class="w--[50cqw] h--full overflow--hidden no-shrink" style="position: relative;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
      
      <!-- Branding Overlay -->
      <div style="position: absolute; bottom: 15px; left: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 2;">
        <img src="{{ logo_url }}" class="image image-dither w--24 h--24" style="background: white; padding: 2px; border: 1px solid black;" />
        <img src="{{ qr_url }}" class="image w--24 h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      </div>
    </div>

    <!-- Right: Text Area (50%) - Integrated White Box Look -->
    <div class="w--[50cqw] h--full flex flex--col p--4 justify--top no-shrink" style="background-color: white;">
      <div class="flex flex--col grow p--3" style="border: 4px solid black; height: 100%; text-align: left;">
        <!-- Date Header -->
        <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 20px; color: black; opacity: 0.9; margin-bottom: 6px;">{{ archive_date }}</div>
        <!-- Title -->
        <div class="title title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid black; padding-top: 6px;">{{ title }}</div>
        <!-- Description -->
        <div class="description description--xxlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3; margin-top: 15px;">{{ description }}</div>
      </div>
    </div>
  </div>

</div>
