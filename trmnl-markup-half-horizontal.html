<!-- HALF HORIZONTAL VIEW (40/60 Split & Overlay Branding) -->
<div class="layout layout--row bg--white p--0" style="height: 100%;">
  
  <!-- Image Column: 40% of the screen with Overlay Branding -->
  <div class="w--[40cqw] h--full overflow--hidden no-shrink" style="position: relative;">
    <!-- Background GIF -->
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    
    <!-- Branding Overlay (Stacked in bottom-left of image) -->
    <div style="position: absolute; bottom: 8px; left: 8px; display: flex; flex-direction: column; gap: 8px; z-index: 2;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- Content Column: 60% of the screen, Left-Aligned -->
  <div class="w--[60cqw] h--full flex flex--col p--3 justify--top no-shrink">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <!-- Title -->
      <div class="title title--medium text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left; width: 100%;">{{ title }}</div>
      
      <!-- Date: Left-aligned border/padding -->
      <div class="label label--tiny text--black" style="margin: 6px 0; opacity: 0.7; border-top: 1px solid rgba(0,0,0,0.2); padding-top: 4px; letter-spacing: 1px; text-align: left; width: 100%;">{{ archive_date }}</div>
      
      <!-- Description -->
      <div class="description description--base text--black" style="line-height: 1.2; text-align: left; width: 100%;">{{ description }}</div>
    </div>
  </div>
</div>
