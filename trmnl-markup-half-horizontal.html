<!-- HALF HORIZONTAL VIEW (Fixed Mutually Exclusive Layouts) -->
<div class="layout layout--row bg--white p--0" style="height: 100%;">
  
  <!-- Image Column (50%) -->
  <div class="w--[50cqw] h--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    <div style="position: absolute; bottom: 10px; left: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 2;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- COLOR CONTENT COLUMN (Visible ONLY on 2bit/Color screens; Hidden on 1bit and X) -->
  <div class="w--[50cqw] h--full flex flex--col p--4 justify--top no-shrink 1bit:hidden lg:hidden" style="background-color: #D65A62; text-align: left;">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: white; opacity: 0.9; margin-bottom: 4px; text-align: left;">{{ archive_date }}</div>
      <div class="title title--medium" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left; width: 100%; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px; color: white;">{{ title }}</div>
      <div class="description description--large" style="font-family: serif; font-style: italic; line-height: 1.3; text-align: left; width: 100%; margin-top: 10px; color: white;">{{ description }}</div>
    </div>
  </div>

  <!-- MONOCHROME CONTENT COLUMN (Visible on 1bit and TRMNL X; Hidden on Color) -->
  <div class="w--[50cqw] h--full hidden 1bit:flex lg:flex flex--col p--4 lg:p--8 justify--top no-shrink" style="background-color: white; text-align: left;">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <div class="lg:title--large" style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: black; opacity: 0.8; margin-bottom: 4px; text-align: left;">{{ archive_date }}</div>
      <div class="title title--medium lg:title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
      <div class="description description--large lg:description--xxlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3; text-align: left; width: 100%; margin-top: 10px;">{{ description }}</div>
    </div>
  </div>

</div>
