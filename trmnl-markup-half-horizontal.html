<!-- HALF HORIZONTAL VIEW (Prior Version + Crimson Support) -->
<div class="layout layout--row bg--white p--0" style="height: 100%;">
  
  <!-- Image Column: 50% of the screen with Overlay Branding -->
  <div class="w--[50cqw] h--full overflow--hidden no-shrink" style="position: relative;">
    <!-- Background GIF -->
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    
    <!-- Branding Overlay (Stacked in bottom-left of image) -->
    <div style="position: absolute; bottom: 10px; left: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 2;">
      <!-- Branding scales up for TRMNL X (lg) -->
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- COLOR CONTENT COLUMN (Hidden on 1bit) -->
  <div class="w--[50cqw] h--full flex flex--col p--4 lg:p--8 justify--top no-shrink 1bit:hidden" style="background-color: #D65A62;">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <!-- Date -->
      <div class="lg:title--large" style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: white; opacity: 0.9; margin-bottom: 4px; text-align: left; width: 100%;">{{ archive_date }}</div>
      <!-- Title -->
      <div class="title title--medium lg:title--xxlarge" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left; width: 100%; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px; color: white;">{{ title }}</div>
      <!-- Description -->
      <div class="description description--large lg:description--xxlarge" style="font-family: serif; font-style: italic; line-height: 1.3; text-align: left; width: 100%; margin-top: 10px; color: white;">{{ description }}</div>
    </div>
  </div>

  <!-- MONOCHROME CONTENT COLUMN (Visible on 1bit) -->
  <div class="w--[50cqw] h--full flex flex--col p--4 lg:p--8 justify--top no-shrink hidden 1bit:flex" style="background-color: white;">
    <div class="flex flex--col" style="text-align: left; width: 100%;">
      <!-- Date -->
      <div class="lg:title--large" style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: black; opacity: 0.8; margin-bottom: 4px; text-align: left; width: 100%;">{{ archive_date }}</div>
      <!-- Title -->
      <div class="title title--medium lg:title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
      <!-- Description -->
      <div class="description description--large lg:description--xxlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3; text-align: left; width: 100%; margin-top: 10px;">{{ description }}</div>
    </div>
  </div>

</div>
