<!-- HALF HORIZONTAL VIEW (v27 - Targeted Boldness) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<div class="layout layout--row p--0 1bit:bg--white lg:bg--white bg--red-30" style="height: 100%;">
  
  <!-- Image Side -->
  <div class="w--[50cqw] h--full overflow--hidden no-shrink bg--black" style="position: relative; z-index: 1;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
    <div class="flex flex--col gap--small" style="position: absolute; bottom: 10px; left: 10px; z-index: 2;">
      <div class="bg--white p--1 w--12 h--12 lg:w--24 h--24 no-shrink border--1 border--solid border--black">
        <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
      </div>
      <div class="bg--white p--1 w--12 h--12 lg:w--24 h--24 no-shrink border--1 border--solid border--black">
        <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
      </div>
    </div>
  </div>

  <!-- Content Half -->
  <div class="w--[50cqw] h--full no-shrink" style="position: relative;">
    
    <!-- 1. COLOR VERSION (Standard Bold) -->
    <div class="flex flex--col flex--align-start p--4 justify--top 1bit:hidden lg:hidden text--left" style="height: 100%; width: 100%;">
      <div class="text--white text--left w--full mb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
      <div class="title title--medium text--white text--left w--full border--1 border--solid border--white border--left-0 border--right-0 border--bottom-0 pt--1 pb--1" 
           style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
      <div class="description description--large text--white text--left w--full mt--2" style="font-family: 'Besley', serif; font-style: italic;">{{ description }}</div>
    </div>

    <!-- 2. MONOCHROME VERSION (Standard Bold) -->
    <div class="hidden 1bit:flex lg:hidden flex--col flex--align-start p--4 justify--top bg--white text--left" style="height: 100%; width: 100%;">
      <div class="text--black text--left w--full mb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
      <div class="title title--medium text--black text--left w--full border--1 border--solid border--black border--left-0 border--right-0 border--bottom-0 pt--1 pb--1" 
           style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
      <div class="description description--large text--black text--left w--full mt--2" style="font-family: 'Besley', serif; font-style: italic;">{{ description }}</div>
    </div>

    <!-- 3. TRMNL X VERSION (Max Bold 900) -->
    <div class="hidden lg:flex flex--col flex--align-start p--8 justify--top bg--white text--left" style="height: 100%; width: 100%;">
      <div class="text--black text--left w--full mb--2" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
      <div class="title title--xxlarge text--black text--left w--full border--1 border--solid border--black border--left-0 border--right-0 border--bottom-0 pt--1 pb--1" 
           style="font-family: 'Besley', serif; font-style: italic; font-weight: 900; line-height: 1.2;">{{ title }}</div>
      <div class="description description--xxlarge text--black text--left w--full mt--3" 
           style="font-family: 'Besley', serif; font-style: italic;">{{ description }}</div>
    </div>

  </div>

</div>
