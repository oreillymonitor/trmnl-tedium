<!-- HALF HORIZONTAL VIEW (v25 - Final Spacing Fixes) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
  
  /* Targeted boldness for TRMNL X headlines */
  .lg .title--xxlarge { font-weight: 900 !important; }
</style>

<div class="layout layout--row p--0 1bit:bg--white lg:bg--white bg--red-30" style="height: 100%;">
  
  <!-- Image Side -->
  <div class="w--[50cqw] h--full overflow--hidden no-shrink bg--black" style="position: relative; z-index: 1;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
    <div class="flex flex--col gap--small" style="position: absolute; bottom: 10px; left: 10px; z-index: 2;">
      <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
        <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
      </div>
      <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
        <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
      </div>
    </div>
  </div>

  <!-- Unified Content Side: Optimized for Besley descenders -->
  <div class="w--[50cqw] h--full no-shrink p--4 lg:p--8 flex flex--col flex--align-start justify--top text--left 1bit:bg--white lg:bg--white bg--red-30" style="position: relative; z-index: 1;">
    <div class="1bit:text--black lg:text--black text--white text--left w--full mb--1 lg:mb--2" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
    
    <!-- Title: Height 1.2 and Padding-bottom for clearance -->
    <div class="title title--medium lg:title--xlarge 1bit:text--black lg:text--black text--white text--left w--full border--1 border--solid 1bit:border--black lg:border--black border--white border--left-0 border--right-0 border--bottom-0 pt--1 pb--2" 
         style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
    
    <!-- Description: Reduced X size and Line-height 1.4 for maximum clearance -->
    <div class="description description--large lg:description--xlarge 1bit:text--black lg:text--black text--white text--left w--full mt--3 lg:mt--6 pb--1" 
         style="font-family: 'Besley', serif; font-style: italic; line-height: 1.4;">{{ description }}</div>
  </div>

</div>
