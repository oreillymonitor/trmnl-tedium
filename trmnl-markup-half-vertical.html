<!-- HALF VERTICAL VIEW (v32 - TRMNL X Spacing Fix) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
  
  /* Targeted boldness for titles on TRMNL X */
  .lg .title--base, .lg .description--xxlarge { font-weight: 900 !important; }
  .lg .description--xlarge { font-weight: 400 !important; }
</style>

<div class="layout layout--col p--0 1bit:bg--white lg:bg--white bg--red-30" style="height: 100%;">
  
  <!-- Image Side -->
  <div class="h--[50cqh] w--full overflow--hidden no-shrink bg--black" style="position: relative; z-index: 1;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
    <div class="flex gap--small" style="position: absolute; bottom: 10px; right: 10px; z-index: 2;">
      <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
        <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
      </div>
      <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
        <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
      </div>
    </div>
  </div>

  <!-- Unified Content Side -->
  <div class="flex flex--col flex--align-start grow p--4 lg:p--8 justify--top text--left w--full 1bit:bg--white lg:bg--white bg--red-30 mt--[-1px]" style="position: relative; z-index: 1;">
    <div class="1bit:text--black lg:text--black text--white text--left w--full mb--1 lg:mb--2" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
    
    <!-- Title: Matched to previous description size for X -->
    <div class="title title--base lg:description--xxlarge 1bit:text--black lg:text--black text--white text--left w--full border--1 border--solid 1bit:border--black lg:border--black border--white border--left-0 border--right-0 border--bottom-0 pt--1 pb--1" 
         style="font-family: 'Besley', serif; font-style: italic; line-height: 1.2;">{{ title }}</div>
    
    <!-- Description: Bumped down one size for X -->
    <div class="description description--large lg:description--xlarge 1bit:text--black lg:text--black text--white text--left w--full mt--1 pb--1" 
         style="font-family: 'Besley', serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
  </div>

</div>
