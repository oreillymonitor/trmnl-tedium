<!-- HALF VERTICAL VIEW (v23 - Total Parity Fix) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<div class="layout layout--col p--0 1bit:bg--white lg:bg--white bg--red-30" style="height: 100%;">
  
  <!-- Image Side (50%) -->
  <div class="h--[50cqh] w--full overflow--hidden no-shrink bg--black" style="position: relative; z-index: 1;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
    <div class="flex gap--small" style="position: absolute; bottom: 10px; right: 10px; z-index: 2;">
      <div class="bg--white p--1 w--12 h--12 no-shrink border--1 border--solid border--black">
        <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
      </div>
      <div class="bg--white p--1 w--12 h--12 no-shrink border--1 border--solid border--black">
        <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
      </div>
    </div>
  </div>

  <!-- Content Half (50%) -->
  <div class="h--[50cqh] w--full no-shrink" style="position: relative;">
    
    <!-- COLOR VERSION (Identical formatting to Monochrome) -->
    <div class="flex flex--col flex--align-start grow p--4 justify--top 1bit:hidden lg:hidden text--left w--full" style="height: 100%;">
      <div class="text--white text--left w--full mb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
      <div class="title title--base text--white text--left w--full border--1 border--solid border--white border--left-0 border--right-0 border--bottom-0 pt--1 pb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ title }}</div>
      <div class="description description--large text--white text--left w--full mt--2" style="font-family: 'Besley', serif; font-style: italic;">{{ description }}</div>
    </div>

    <!-- MONOCHROME VERSION (The 'Perfect' Reference) -->
    <div class="hidden 1bit:flex lg:flex flex--col flex--align-start grow p--4 lg:p--8 justify--top bg--white text--left" style="height: 100%; width: 100%;">
      <div class="text--black text--left w--full mb--1 lg:mb--2" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</div>
      <div class="title title--base lg:title--xxlarge text--black text--left w--full border--1 border--solid border--black border--left-0 border--right-0 border--bottom-0 pt--1 pb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ title }}</div>
      <div class="description description--large lg:description--xxlarge text--black text--left w--full mt--2 lg:mt--3" style="font-family: 'Besley', serif; font-style: italic;">{{ description }}</div>
    </div>

  </div>

</div>
