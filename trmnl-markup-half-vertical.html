<!-- HALF VERTICAL VIEW (v13 - Definitive Dual Layout) -->
<div class="layout layout--col p--0" style="height: 100%;">
  
  <!-- 1. STANDARD HARDWARE (OG/Color) -->
  <div class="lg:hidden flex flex--col h--full w--full" style="position: relative; background-color: #D65A62;">
    <!-- Monochrome Base Override (Visible only on 1bit) -->
    <div class="hidden 1bit:block" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: white; z-index: 0;"></div>
    
    <!-- Image Side (50%) -->
    <div class="h--[50cqh] w--full overflow--hidden no-shrink" style="position: relative; z-index: 1; background-color: black;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }}; display: block;" />
      <div style="position: absolute; bottom: 10px; right: 10px; display: flex; gap: 8px; z-index: 2;">
        <img src="{{ logo_url }}" class="image image-dither w--12 h--12" style="background: white; padding: 2px; border: 1px solid black;" />
        <img src="{{ qr_url }}" class="image w--12 h--12" style="background: white; padding: 2px; border: 1px solid black;" />
      </div>
    </div>

    <!-- Text Side (50%) -->
    <div class="flex flex--col flex--align-start grow p--4 justify--top" style="position: relative; z-index: 1; text-align: left;">
      <!-- COLOR TEXT (White on Crimson) -->
      <div class="1bit:hidden flex flex--col flex--align-start" style="text-align: left; width: 100%;">
        <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: white; opacity: 0.9; margin-bottom: 4px; text-align: left; width: 100%;">{{ archive_date }}</div>
        <div class="title title--base" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px; color: white; text-align: left;">{{ title }}</div>
        <div class="description description--large" style="font-family: serif; font-style: italic; line-height: 1.3; width: 100%; margin-top: 10px; color: white; text-align: left;">{{ description }}</div>
      </div>
      <!-- MONOCHROME TEXT (Black on White) -->
      <div class="hidden 1bit:flex flex--col flex--align-start" style="text-align: left; width: 100%;">
        <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: black; opacity: 0.8; margin-bottom: 4px; width: 100%; text-align: left;">{{ archive_date }}</div>
        <div class="title title--base text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px; text-align: left;">{{ title }}</div>
        <div class="description description--large text--black" style="font-family: serif; font-style: italic; line-height: 1.3; width: 100%; margin-top: 10px; text-align: left;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- 2. TRMNL X HARDWARE (lg) -->
  <div class="hidden lg:flex flex--col h--full w--full" style="background-color: white;">
    <!-- Image Side (50%) -->
    <div class="h--[50cqh] w--full overflow--hidden no-shrink" style="position: relative; background-color: black;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }}; display: block;" />
      <div style="position: absolute; bottom: 10px; right: 10px; display: flex; gap: 8px; z-index: 2;">
        <img src="{{ logo_url }}" class="image image-dither w--24 h--24" style="background: white; padding: 2px; border: 1px solid black;" />
        <img src="{{ qr_url }}" class="image w--24 h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      </div>
    </div>
    <!-- Text Side (50%) -->
    <div class="flex flex--col flex--align-start grow p--8 justify--top" style="text-align: left;">
      <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 20px; color: black; opacity: 0.9; margin-bottom: 6px; text-align: left; width: 100%;">{{ archive_date }}</div>
      <div class="title title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid black; padding-top: 8px; text-align: left;">{{ title }}</div>
      <div class="description description--xxlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3; width: 100%; margin-top: 15px; text-align: left;">{{ description }}</div>
    </div>
  </div>

</div>
