<!-- HALF VERTICAL VIEW (v18 - High Scanability QR) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<div class="layout layout--col p--0 1bit:bg--white lg:bg--white bg--red-30" style="height: 100%;">
  
  <!-- 1. STANDARD HARDWARE (OG/Color) -->
  <div class="lg:hidden flex flex--col h--full w--full" style="position: relative;">
    <div class="hidden 1bit:block bg--white" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>
    
    <!-- Image Side (50%) -->
    <div class="h--[50cqh] w--full overflow--hidden no-shrink bg--black" style="position: relative; z-index: 1;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
      <!-- High Scanability Branding -->
      <div class="flex gap--small" style="position: absolute; bottom: 10px; right: 10px; z-index: 2;">
        <div class="bg--white p--1" style="border: 1px solid black;">
          <img src="{{ logo_url }}" class="image image-dither w--10 h--10" style="display: block;" />
        </div>
        <div class="bg--white p--1" style="border: 1px solid black;">
          <img src="{{ qr_url }}" class="image w--10 h--10" style="display: block;" />
        </div>
      </div>
    </div>

    <!-- Text Side (50%) -->
    <div class="flex flex--col flex--align-start grow p--4 justify--top text--left w--full" style="position: relative; z-index: 1;">
      <div class="1bit:hidden flex flex--col flex--align-start w--full text--left">
        <div class="text--white" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; opacity: 0.9; margin-bottom: 4px; width: 100%;">{{ archive_date }}</div>
        <div class="title title--base text--white text--left w--full" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px; color: white;">{{ title }}</div>
        <div class="description description--large text--white text--left w--full mt--2" style="font-family: 'Besley', serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
      </div>
      <div class="hidden 1bit:flex flex--col flex--align-start w--full text--left">
        <div class="text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; opacity: 0.8; margin-bottom: 4px; width: 100%;">{{ archive_date }}</div>
        <div class="title title--base text--black text--left w--full" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
        <div class="description description--large text--black text--left w--full mt--2" style="font-family: 'Besley', serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- 2. TRMNL X HARDWARE (lg) -->
  <div class="hidden lg:flex flex--col h--full w--full bg--white">
    <!-- Image Side (50%) -->
    <div class="h--[50cqh] w--full overflow--hidden no-shrink bg--black" style="position: relative;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
      <!-- High Scanability Branding -->
      <div class="flex gap--medium" style="position: absolute; bottom: 10px; right: 10px; z-index: 2;">
        <div class="bg--white p--1" style="border: 1px solid black;">
          <img src="{{ logo_url }}" class="image image-dither w--22 h--22" style="display: block;" />
        </div>
        <div class="bg--white p--1" style="border: 1px solid black;">
          <img src="{{ qr_url }}" class="image w--22 h--22" style="display: block;" />
        </div>
      </div>
    </div>
    <!-- Text Side (50%) -->
    <div class="flex flex--col flex--align-start grow p--8 justify--top text--left w--full">
      <div class="text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; opacity: 0.9; margin-bottom: 6px; width: 100%;">{{ archive_date }}</div>
      <div class="title title--xxlarge text--black text--left w--full mt--2" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.1; border-top: 1px solid black; padding-top: 8px;">{{ title }}</div>
      <div class="description description--xxlarge text--black text--left w--full mt--3" style="font-family: 'Besley', serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
    </div>
  </div>

</div>
