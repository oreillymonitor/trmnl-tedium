<!-- HALF VERTICAL VIEW (Fixed Mutually Exclusive Layouts) -->
<div class="layout layout--col bg--white p--0" style="height: 100%;">
  
  <!-- Image Area (50%) -->
  <div class="h--[50cqh] w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    <div style="position: absolute; bottom: 10px; right: 10px; display: flex; gap: 8px; z-index: 2;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- COLOR CONTENT AREA (Hidden on 1bit and X) -->
  <div class="flex flex--col grow p--4 lg:p--8 justify--top 1bit:hidden lg:hidden" style="background-color: #D65A62; text-align: left;">
    <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: white; opacity: 0.9; margin-bottom: 4px; width: 100%; text-align: left;">{{ archive_date }}</div>
    <div class="title title--base" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; color: white; width: 100%; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 4px; text-align: left;">{{ title }}</div>
    <div class="description description--large" style="font-family: serif; font-style: italic; line-height: 1.3; color: white; margin-top: 10px; width: 100%; text-align: left;">{{ description }}</div>
  </div>

  <!-- MONOCHROME CONTENT AREA (Visible on 1bit and TRMNL X) -->
  <div class="hidden 1bit:flex lg:flex flex--col grow p--4 lg:p--8 justify--top" style="background-color: white; text-align: left;">
    <div class="lg:title--large" style="font-family: serif; font-style: italic; font-weight: bold; font-size: 14px; color: black; opacity: 0.8; margin-bottom: 4px; width: 100%; text-align: left;">{{ archive_date }}</div>
    <div class="title title--base lg:title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px; text-align: left;">{{ title }}</div>
    <div class="description description--large lg:description--xxlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3; margin-top: 10px; width: 100%; text-align: left;">{{ description }}</div>
  </div>

</div>
