<!-- 
  TEDIUM EDITORIAL POSTER (v32 - True Unified Parity)
  - Single-container strategy for 100% identical wrapping
  - Besley font with descender clearance
  - Targeted boldness for TRMNL X
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
  
  /* Targeted boldness for TRMNL X headlines */
  .lg .title--xxlarge { font-weight: 900 !important; }
</style>

<div class="layout p--0 bg--black" style="position: relative; height: 100%; width: 100%; overflow: hidden;">
  <!-- Background Layer -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;" />
  
  <!-- Centered Editorial Box -->
  <div class="flex flex--col flex--center p--4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
    <!-- Unified Container: One div for all modes -->
    <div class="1bit:bg--white lg:bg--white bg--red-30 p--4 lg:p--8 border--2 border--solid 1bit:border--black lg:border--black border--white" 
         style="width: 82%; lg:width: 75%; border-color: rgba(255,255,255,0.3); position: relative;">
      <div class="flex flex--col grow text--left w--full">
        <!-- Title: Integrated padding-bottom for descender clearance -->
        <div class="title title--large lg:title--xxlarge 1bit:text--black lg:text--black text--white pb--1" 
             style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
        
        <div class="description description--xlarge lg:description--xxlarge 1bit:text--black lg:text--black text--white mt--1" 
             style="font-family: 'Besley', serif;">{{ description }}</div>
        
        <div class="mt--2 text--right w--full">
          <span class="label label--base 1bit:text--black lg:text--black text--white" 
                style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Branding Layer -->
  <div class="flex gap--medium flex--align-end" style="position: absolute; bottom: 15px; right: 15px; z-index: 4;">
    <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
      <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
    </div>
    <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
      <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
    </div>
  </div>
</div>
