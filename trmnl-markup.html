<!-- 
  TEDIUM EDITORIAL POSTER (v34 - Targeted Boldness)
  - Standard bold (700) for OG/Color
  - Max bold (900) for TRMNL X only
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<div class="layout p--0 bg--black" style="position: relative; height: 100%; width: 100%; overflow: hidden;">
  <!-- Background -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;" />
  
  <!-- 1. COLOR/ADVANCED DEVICE BOX (Standard Bold) -->
  <div class="flex flex--col flex--center p--4 1bit:hidden lg:hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
    <div class="bg--red-30 p--4 border--2 border--solid" style="width: 82%; border-color: rgba(255,255,255,0.3); position: relative;">
      <div class="flex flex--col grow text--left w--full">
        <div class="title title--large text--white" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
        <div class="description description--xlarge text--white mt--1" style="font-family: 'Besley', serif;">{{ description }}</div>
        <div class="mt--1 text--right w--full">
          <span class="label label--base text--white" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. STANDARD MONOCHROME BOX (Standard Bold) -->
  <div class="hidden 1bit:flex lg:hidden flex--col flex--center p--4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;">
    <div class="w--[82cqw] bg--white p--4 border--2 border--solid border--black" style="position: relative;">
      <div class="flex flex--col grow text--left w--full">
        <div class="title title--large text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
        <div class="description description--xlarge text--black mt--1" style="font-family: 'Besley', serif;">{{ description }}</div>
        <div class="mt--2 text--right w--full">
          <span class="label label--base text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. TRMNL X BOX (Max Bold 900) -->
  <div class="hidden lg:flex flex--col flex--center p--4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4;">
    <div class="w--[75cqw] bg--white p--8 border--2 border--solid border--black" style="position: relative;">
      <div class="flex flex--col grow text--left w--full">
        <div class="title title--xxlarge text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: 900; line-height: 1.2;">{{ title }}</div>
        <div class="description description--xxlarge text--black mt--1" style="font-family: 'Besley', serif;">{{ description }}</div>
        <div class="mt--2 text--right w--full">
          <span class="label label--base text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Branding -->
  <div class="flex gap--medium flex--align-end" style="position: absolute; bottom: 15px; right: 15px; z-index: 5;">
    <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
      <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
    </div>
    <div class="bg--white p--1 w--20 h--20 lg:w--32 lg:h--32 no-shrink border--1 border--solid border--black">
      <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
    </div>
  </div>
</div>
