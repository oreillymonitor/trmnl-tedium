<!-- 
  TEDIUM EDITORIAL POSTER (v25 - High Scanability QR)
  - Added white quiet zone and border to QR code for easier scanning
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<div class="layout p--0 bg--black" style="position: relative; height: 100%; width: 100%; overflow: hidden;">
  <!-- Background Layer -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;" />
  
  <!-- COLOR/ADVANCED DEVICE BOX -->
  <div class="flex flex--col flex--center p--4 1bit:hidden lg:hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
    <div class="bg--red-30 p--4" style="width: 82%; border: 2px solid rgba(255,255,255,0.3); position: relative;">
      <div class="flex flex--col grow text--left">
        <div class="title title--large text--white" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.1;">{{ title }}</div>
        <div class="description description--xlarge text--white" style="line-height: 1.25;">{{ description }}</div>
        <div class="mt--1 text--right" style="width: 100%;">
          <span class="label label--base text--white" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- WHITE BOX (Standard Monochrome & TRMNL X) -->
  <div class="hidden 1bit:flex lg:flex flex--col flex--center p--4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;">
    <div class="w--[82cqw] lg:w--[75cqw] bg--white p--4 lg:p--8" style="border: 2px solid black; position: relative;">
      <div class="flex flex--col grow text--left">
        <div class="title title--large lg:title--xxlarge text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.1;">{{ title }}</div>
        <div class="description description--xlarge lg:description--xxlarge text--black" style="line-height: 1.25;">{{ description }}</div>
        <div class="mt--2 text--right" style="width: 100%;">
          <span class="label label--base text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- BRANDING LAYER (High Scanability) -->
  <div class="flex gap--medium flex--align-end" style="position: absolute; bottom: 15px; right: 15px; z-index: 4;">
    <!-- Logo -->
    <div class="bg--white p--1" style="border: 1px solid black;">
      <img src="{{ logo_url }}" class="image image-dither w--18 h--18 lg:w--30 lg:h--30" style="display: block;" />
    </div>
    <!-- QR Code with white quiet zone and border -->
    <div class="bg--white p--1" style="border: 1px solid black;">
      <img src="{{ qr_url }}" class="image w--18 h--18 lg:w--30 lg:h--30" style="display: block;" />
    </div>
  </div>
</div>
