<!-- 
  TEDIUM EDITORIAL POSTER (v9 - Final Polish)
  - Precision balanced Logo (72px) and QR (70px)
  - Tighter editorial box (reduced padding)
  - Date in bottom-right of box (no "Archive" label)
-->

<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden; background-color: black;">
  <!-- Background Layer -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.7;" />
  
  <!-- COLOR/ADVANCED DEVICE BOX -->
  <div class="flex flex--col flex--center 1bit:hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 20px;">
    <div style="background-color: rgba(214, 90, 98, 0.95); width: 82%; padding: 15px 25px; border: 2px solid rgba(255,255,255,0.3); position: relative;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1; margin-bottom: 5px;">{{ title }}</div>
        <div class="description description--xlarge" style="color: white; line-height: 1.25; margin-bottom: 10px;">{{ description }}</div>
        
        <!-- Date in bottom right of box -->
        <div style="text-align: right; width: 100%;">
          <span class="label label--small" style="color: white; opacity: 0.8; letter-spacing: 0.5px;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- MONOCHROME (1BIT) DEVICE BOX -->
  <div class="hidden 1bit:flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; padding: 20px;">
    <div style="background-color: rgba(255, 255, 255, 0.95); width: 82%; padding: 15px 25px; border: 4px solid black; position: relative;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; margin-bottom: 5px;">{{ title }}</div>
        <div class="description description--xlarge text--black" style="line-height: 1.25; margin-bottom: 10px;">{{ description }}</div>
        
        <!-- Date in bottom right of box -->
        <div style="text-align: right; width: 100%;">
          <span class="label label--small text--black" style="opacity: 0.7; letter-spacing: 0.5px;">{{ archive_date }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- BRANDING LAYER (Bottom Right Alignment) -->
  <div style="position: absolute; bottom: 15px; right: 15px; display: flex; gap: 12px; align-items: flex-end; z-index: 4;">
    
    <!-- Tedium Logo (Precision Sized 72px) -->
    <img src="{{ logo_url }}" class="image image-dither" style="width: 72px; height: 72px; border: 1px solid rgba(255,255,255,0.2);" />

    <!-- QR Code (70px) -->
    <img src="{{ qr_url }}" class="image" style="width: 70px; height: 70px; border: 1px solid rgba(255,255,255,0.2);" />

  </div>
</div>
