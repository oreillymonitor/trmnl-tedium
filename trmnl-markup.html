<!-- 
  TEDIUM POSTER VIEW
  Full-screen image with a title box overlay.
  Note: No <html>, <body>, or <div class="view"> tags.
-->

<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden;">
  <!-- Full Screen Background Image -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;" />
  
  <!-- Overlay Content -->
  <div class="flex flex--col flex--center-x flex--center-y" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 40px;">
    
    <!-- Title Box (The Tedium Look) -->
    <div class="bg--white" style="border: 4px solid black; padding: 30px; box-shadow: 12px 12px 0px black; max-width: 90%; min-width: 60%;">
      <div class="title title--xlarge" style="line-height: 1.1; color: black; font-weight: bold;">{{ title }}</div>
      
      <div class="flex flex--row flex--between flex--align-end" style="margin-top: 25px;">
        <div class="flex flex--col">
          <span class="label label--small" style="color: black; font-weight: bold; text-transform: uppercase;">Tedium Archive</span>
          <span class="label label--small" style="color: black;">{{ archive_date }}</span>
        </div>
        
        <!-- QR Code -->
        <div style="background: white; padding: 4px; border: 2px solid black; margin-left: 20px;">
          <img src="{{ qr_url }}" class="image" style="width: 60px; height: 60px; display: block;" />
        </div>
      </div>
    </div>
    
  </div>
</div>
