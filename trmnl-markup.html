<div class="layout layout--col layout--stretch">
  <div class="flex flex--col gap--base stretch-y">
    <div class="flex flex--row flex--space-between flex--align-start">
      <span class="title title--large stretch-x" style="line-height: 1.1;">{{ title }}</span>
      <img src="{{ qr_url }}" class="image" style="width: 80px; height: 80px; margin-left: 20px;" />
    </div>
    
    <span class="description description--base" data-clamp="3">{{ description }}</span>

    <div class="flex flex--col flex--center stretch-y" style="overflow: hidden;">
      <img class="image image-dither image--contain" src="{{ image_url }}" style="max-height: 100%;" />
    </div>
  </div>

  <div class="flex flex--row flex--space-between flex--align-end" style="border-top: 1px solid var(--gray-40); padding-top: 5px; margin-top: 5px;">
    <div class="flex flex--col">
      <span class="label label--small">TEDIUM.CO</span>
      <span class="label label--small">{{ archive_date }}</span>
    </div>
    <span class="title title--small">TRMNL TEDIUM</span>
  </div>
</div>

<div class="title_bar">
  <img class="image" src="{{ favicon }}" style="filter: grayscale(100%);">
  <span class="title">TEDIUM</span>
  <span class="instance">Random Archive</span>
</div>
