<!-- 
  TEDIUM EDITORIAL THUMBNAIL VIEW
  Matches the JSON specification:
  - 16:9 Aspect Ratio Focus
  - Grayscale Background Layer
  - Muted Crimson Overlay (#D65A62)
  - Bold Italic Serif Typography
-->

<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden; background-color: black;">
  <!-- Background Layer: Grayscale Image -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.8;" />
  
  <!-- Overlay Element Container -->
  <div class="flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
    
    <!-- Red Rectangular Text Box (Muted Crimson) -->
    <!-- Using inline background color for TRMNL X (color) compatibility -->
    <div style="background-color: #D65A62; width: 75%; padding: 25px 40px; position: relative; box-shadow: 10px 10px 20px rgba(0,0,0,0.5);">
      
      <div class="flex flex--row flex--between flex--align-center">
        <!-- Typography: Serif, Bold, Italic -->
        <div class="title title--large" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.2; flex-grow: 1; text-align: left;">
          {{ title }}
        </div>

        <!-- Subtle White QR Code for contrast on red -->
        <div style="background: white; padding: 3px; margin-left: 20px; border: 1px solid white;">
          <img src="{{ qr_url }}" class="image" style="width: 55px; height: 55px; display: block;" />
        </div>
      </div>

      <!-- Optional Archive Date Tag -->
      <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 5px;">
        <span class="label label--small" style="color: white; opacity: 0.9; letter-spacing: 1px; font-weight: bold;">TEDIUM // {{ archive_date }}</span>
      </div>
    </div>
    
  </div>
</div>

<div class="title_bar">
  <img class="image" src="{{ favicon }}">
  <span class="title">TEDIUM</span>
  <span class="instance">Random Archive</span>
</div>
