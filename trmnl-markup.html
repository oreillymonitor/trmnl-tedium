<!-- 
  TEDIUM EDITORIAL POSTER (v8 - Refined Metadata & Branding)
  - Date integrated between title and description
  - Larger description text
  - Branding (Logo & QR) side-by-side in bottom right
  - No meta bar at the bottom
-->

<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden; background-color: black;">
  <!-- Background Layer -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.7;" />
  
  <!-- COLOR/ADVANCED DEVICE BOX -->
  <div class="flex flex--col flex--center 1bit:hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 20px;">
    <div style="background-color: rgba(214, 90, 98, 0.95); width: 85%; padding: 30px 40px; border: 2px solid rgba(255,255,255,0.3);">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1; text-align: left; width: 100%;">{{ title }}</div>
        
        <!-- Integrated Date -->
        <div class="label label--small" style="color: white; opacity: 0.8; margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; letter-spacing: 1px;">ARCHIVE: {{ archive_date }}</div>
        
        <div class="description description--xlarge" style="color: white; line-height: 1.3; text-align: left; width: 100%;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- MONOCHROME (1BIT) DEVICE BOX -->
  <div class="hidden 1bit:flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; padding: 20px;">
    <div style="background-color: rgba(255, 255, 255, 0.95); width: 85%; padding: 30px 40px; border: 4px solid black;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left; width: 100%;">{{ title }}</div>
        
        <!-- Integrated Date -->
        <div class="label label--small text--black" style="opacity: 0.7; margin: 10px 0; border-top: 1px solid black; padding-top: 5px; letter-spacing: 1px;">ARCHIVE: {{ archive_date }}</div>
        
        <div class="description description--xlarge text--black" style="line-height: 1.3; text-align: left; width: 100%;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- BRANDING LAYER (Bottom Right Alignment) -->
  <div style="position: absolute; bottom: 15px; right: 15px; display: flex; gap: 10px; align-items: center; z-index: 4;">
    
    <!-- Tedium Logo (No box, same size as QR) -->
    <img src="{{ logo_url }}" class="image image-dither" style="width: 70px; height: 70px; border: 1px solid rgba(255,255,255,0.2);" />

    <!-- QR Code (No box) -->
    <img src="{{ qr_url }}" class="image" style="width: 70px; height: 70px; border: 1px solid rgba(255,255,255,0.2);" />

  </div>
</div>
