<!-- 
  TEDIUM EDITORIAL POSTER (v14 - Sizing Fix)
  - Full-screen background
  - Fixed responsive sizing (removed inline width/height)
  - Unified White Box for 1bit and X
-->

<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden; background-color: black;">
  <!-- Background Layer -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.7;" />
  
  <!-- 
    CRIMSON BOX (COLOR DEVICES ONLY)
    - Shown on 2bit (Color/BWRY)
    - Hidden on 1bit (Monochrome) and LG (TRMNL X)
  -->
  <div class="flex flex--col flex--center 1bit:hidden lg:hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 15px;">
    <div style="background-color: rgba(214, 90, 98, 0.95); width: 82%; padding: 12px 20px; border: 2px solid rgba(255,255,255,0.3); position: relative;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1; margin-bottom: 5px;">{{ title }}</div>
        <div class="description description--xlarge" style="color: white; line-height: 1.25;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- 
    WHITE BOX (MONOCHROME & TRMNL X)
    - Visible on 1bit
    - Visible on LG (TRMNL X)
  -->
  <div class="hidden 1bit:flex lg:flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; padding: 15px;">
    <div class="lg:w--[75%] lg:padding--[30px]" style="background-color: rgba(255, 255, 255, 0.95); width: 82%; padding: 12px 20px; border: 4px solid black; position: relative;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large lg:title--xxlarge text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; margin-bottom: 5px;">{{ title }}</div>
        <div class="description description--xlarge lg:description--xxlarge text--black" style="line-height: 1.25;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- BRANDING LAYER -->
  <div style="position: absolute; bottom: 20px; right: 20px; display: flex; gap: 15px; align-items: center; z-index: 4;">
    
    <!-- Tedium Logo -->
    <img src="{{ logo_url }}" 
         class="image image-dither w--[70px] h--[70px] lg:w--[120px] lg:h--[120px]" 
         style="border: 1px solid rgba(255,255,255,0.2); display: block;" />

    <!-- QR Code -->
    <img src="{{ qr_url }}" 
         class="image w--[70px] h--[70px] lg:w--[120px] lg:h--[120px]" 
         style="border: 1px solid rgba(255,255,255,0.2); display: block;" />

  </div>
</div>
