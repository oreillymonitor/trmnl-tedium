<!-- 
  TEDIUM EDITORIAL POSTER (v10 - Balanced Branding & Minimalist)
  - Date removed entirely
  - Precision balanced Logo (64px) and QR (70px)
  - Clean, high-impact editorial box
-->

<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden; background-color: black;">
  <!-- Background Layer -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.7;" />
  
  <!-- COLOR/ADVANCED DEVICE BOX -->
  <div class="flex flex--col flex--center 1bit:hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 20px;">
    <div style="background-color: rgba(214, 90, 98, 0.95); width: 82%; padding: 20px 30px; border: 2px solid rgba(255,255,255,0.3); position: relative;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1; margin-bottom: 8px;">{{ title }}</div>
        <div class="description description--xlarge" style="color: white; line-height: 1.3;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- MONOCHROME (1BIT) DEVICE BOX -->
  <div class="hidden 1bit:flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; padding: 20px;">
    <div style="background-color: rgba(255, 255, 255, 0.95); width: 82%; padding: 20px 30px; border: 4px solid black; position: relative;">
      <div class="flex flex--col grow" style="text-align: left;">
        <div class="title title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; margin-bottom: 8px;">{{ title }}</div>
        <div class="description description--xlarge text--black" style="line-height: 1.3;">{{ description }}</div>
      </div>
    </div>
  </div>

  <!-- BRANDING LAYER (Bottom Right Alignment) -->
  <div style="position: absolute; bottom: 15px; right: 15px; display: flex; gap: 12px; align-items: center; z-index: 4;">
    
    <!-- Tedium Logo: Balanced at 64px to account for higher native density -->
    <img src="{{ logo_url }}" class="image image-dither" style="width: 64px; height: 64px; border: 1px solid rgba(255,255,255,0.2);" />

    <!-- QR Code: Balanced at 70px -->
    <img src="{{ qr_url }}" class="image" style="width: 70px; height: 70px; border: 1px solid rgba(255,255,255,0.2);" />

  </div>
</div>
