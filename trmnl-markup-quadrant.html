<!-- QUADRANT VIEW (v32 - Final Precision Fixes) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<div class="layout layout--col p--0 bg--white" style="height: 100%; border: 1px solid rgba(0,0,0,0.1); position: relative;">
  
  <!-- STANDARD HARDWARE LAYOUT -->
  <div class="lg:hidden h--full w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />

    <!-- Title Overlay -->
    <div class="flex flex--col flex--center p--3" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
      <div class="1bit:hidden bg--red-30 p--3" style="width: 92%; border: 1px solid rgba(255,255,255,0.3);">
        <div class="title title--base text--white" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
      </div>
      <div class="hidden 1bit:block bg--white p--3" style="width: 92%; border: 2px solid black;">
        <div class="title title--base text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
      </div>
    </div>

    <!-- Corner Branding -->
    <div class="flex gap--small" style="position: absolute; bottom: 8px; right: 8px; z-index: 3;">
      <div class="bg--white p--1 w--10 h--10 no-shrink" style="border: 1px solid black;">
        <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
      </div>
      <div class="bg--white p--1 w--10 h--10 no-shrink" style="border: 1px solid black;">
        <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
      </div>
    </div>
  </div>

  <!-- TRMNL X HARDWARE LAYOUT -->
  <div class="hidden lg:flex flex--col h--full w--full">
    <!-- Image Top (70%) -->
    <div class="h--[70cqh] w--full overflow--hidden no-shrink bg--black" style="position: relative;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
      
      <!-- Title Box on Image -->
      <div class="flex flex--col flex--center p--3" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
        <div class="bg--white p--3" style="width: 90%; border: 3px solid black;">
          <div class="title title--medium text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.2;">{{ title }}</div>
        </div>
      </div>

      <!-- Branding Overlay -->
      <div class="flex gap--small" style="position: absolute; bottom: 8px; right: 8px; z-index: 3;">
        <div class="bg--white p--1 w--14 h--14 no-shrink" style="border: 1px solid black;">
          <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
        </div>
        <div class="bg--white p--1 w--14 h--14 no-shrink" style="border: 1px solid black;">
          <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
        </div>
      </div>
    </div>

    <!-- Content Bottom (30%) -->
    <div class="flex flex--col grow p--3 justify--top bg--white text--left">
      <div class="title title--small text--black" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; margin-bottom: 2px; line-height: 1.2;">{{ archive_date }}</div>
      <div class="description description--large text--black" style="font-family: 'Besley', serif; font-style: italic; line-height: 1.3;">{{ description }}</div>
    </div>
  </div>

</div>
