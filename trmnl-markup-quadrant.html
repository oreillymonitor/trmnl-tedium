<!-- QUADRANT VIEW (v18 - Adaptive Editorial) -->
<div class="layout layout--col bg--white p--0" style="height: 100%; border: 1px solid rgba(0,0,0,0.1);">
  
  <!-- Image Area: 70% standard, 55% on LG (X) -->
  <div class="h--[70cqh] lg:h--[55cqh] w--full overflow--hidden no-shrink" style="position: relative;">
    <!-- Background GIF -->
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    
    <!-- TRMNL X ONLY: Title Overlay Box (Editorial Style) -->
    <div class="hidden lg:flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 12px;">
      <div style="background-color: rgba(255, 255, 255, 0.95); width: 90%; padding: 10px 15px; border: 2px solid black;">
        <div class="title title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; text-align: left;">{{ title }}</div>
      </div>
    </div>

    <!-- Branding Overlay (Bottom Right) -->
    <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 8px; z-index: 3;">
      <!-- Branding matched to Half-View sizes -->
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- Content Area: Top-aligned to image boundary -->
  <div class="flex flex--col grow p--2 lg:p--4 justify--top" style="text-align: left; height: 100%;">
    
    <!-- STANDARD VIEW: Title directly below picture -->
    <div class="lg:hidden title title--base text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
    
    <!-- TRMNL X VIEW: Date and Large Description -->
    <div class="hidden lg:block" style="width: 100%;">
      <!-- Date: Bold Serif Italic -->
      <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 18px; color: black; opacity: 0.8; margin-bottom: 6px; width: 100%;">{{ archive_date }}</div>
      <!-- Description: Increased size for X -->
      <div class="description description--xlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3;">{{ description | truncate: 140 }}</div>
    </div>

    <!-- Push any remaining space to the bottom -->
    <div class="grow"></div>
  </div>
</div>
