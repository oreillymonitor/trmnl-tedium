<!-- QUADRANT VIEW (v22 - Robust Dual Layout) -->
<div class="layout layout--col bg--white p--0" style="height: 100%; border: 1px solid rgba(0,0,0,0.1); position: relative;">
  
  <!-- 
    STANDARD HARDWARE LAYOUT (Full-Bleed Poster)
    - Shown on standard screens
    - Hidden on TRMNL X (lg)
  -->
  <div class="lg:hidden h--full w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />

    <!-- Overlay Box -->
    <div class="flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 10px;">
      <!-- Color Logic -->
      <div class="1bit:hidden" style="background-color: rgba(214, 90, 98, 0.9); width: 92%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.3);">
        <div class="title title--base" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1;">{{ title }}</div>
      </div>
      <div class="hidden 1bit:block" style="background-color: rgba(255, 255, 255, 0.95); width: 92%; padding: 8px 12px; border: 2px solid black;">
        <div class="title title--base text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1;">{{ title }}</div>
      </div>
    </div>

    <!-- Corner Branding -->
    <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 8px; z-index: 3;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12" style="background: white; padding: 1px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12" style="background: white; padding: 1px; border: 1px solid black;" />
    </div>
  </div>

  <!-- 
    TRMNL X HARDWARE LAYOUT (40/60 Balanced Split)
    - Hidden by default
    - Visible ONLY on TRMNL X (lg)
  -->
  <div class="hidden lg:flex flex--col h--full w--full">
    <!-- Image Top (40%) -->
    <div class="h--[40cqh] w--full overflow--hidden no-shrink" style="position: relative;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
      
      <!-- Title Box on Image -->
      <div class="flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 12px;">
        <div style="background-color: rgba(255, 255, 255, 0.95); width: 90%; padding: 10px 15px; border: 3px solid black;">
          <div class="title title--medium text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1;">{{ title }}</div>
        </div>
      </div>

      <!-- Corner Branding -->
      <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 8px; z-index: 3;">
        <img src="{{ logo_url }}" class="image image-dither w--24 h--24" style="background: white; padding: 2px; border: 1px solid black;" />
        <img src="{{ qr_url }}" class="image w--24 h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      </div>
    </div>

    <!-- Content Bottom (60%) -->
    <div class="flex flex--col grow p--4 justify--top" style="text-align: left; background-color: white; border-top: 2px solid black;">
      <div class="title title--base text--black" style="font-family: serif; font-style: italic; font-weight: bold; opacity: 0.9; margin-bottom: 8px;">May 10, 2026</div>
      <div class="description description--xlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3;">{{ description | truncate: 160 }}</div>
    </div>
  </div>

</div>
