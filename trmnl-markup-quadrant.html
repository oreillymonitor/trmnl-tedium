<!-- QUADRANT VIEW (v20 - Hybrid Editorial) -->
<div class="layout layout--col bg--white p--0" style="height: 100%; border: 1px solid rgba(0,0,0,0.1); position: relative;">
  
  <!-- IMAGE AREA -->
  <!-- 100% height on standard, 55% on TRMNL X (lg) -->
  <div class="h--full lg:h--[55cqh] w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />

    <!-- TITLE BOX OVERLAY -->
    <div class="flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 10px;">
      
      <!-- COLOR BOX (Hidden on 1bit and TRMNL X) -->
      <div class="1bit:hidden lg:hidden" style="background-color: rgba(214, 90, 98, 0.9); width: 90%; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.3);">
        <div class="title title--base" style="font-family: serif; font-style: italic; font-weight: bold; color: white; line-height: 1.1; width: 100%; text-align: left;">{{ title }}</div>
      </div>

      <!-- WHITE BOX (Visible on 1bit and TRMNL X) -->
      <div class="hidden 1bit:block lg:block" style="background-color: rgba(255, 255, 255, 0.95); width: 90%; padding: 8px 12px; border: 3px solid black;">
        <div class="title title--base lg:title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; text-align: left;">{{ title }}</div>
      </div>

    </div>

    <!-- BRANDING OVERLAY (Bottom Right of Image) -->
    <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 8px; align-items: center; z-index: 3;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--20 lg:h--20" style="background: white; padding: 1px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--20 lg:h--20" style="background: white; padding: 1px; border: 1px solid black;" />
    </div>
  </div>

  <!-- METADATA AREA (Visible only on TRMNL X) -->
  <div class="hidden lg:flex flex--col grow p--3 justify--top" style="text-align: left; background-color: white; border-top: 1px solid black;">
    <!-- Date: Bold Serif Italic -->
    <div style="font-family: serif; font-style: italic; font-weight: bold; font-size: 18px; color: black; opacity: 0.9; margin-bottom: 5px; width: 100%;">{{ archive_date }}</div>
    <!-- Description: Large and Clear -->
    <div class="description description--xlarge text--black" style="font-family: serif; font-style: italic; line-height: 1.3;">{{ description | truncate: 140 }}</div>
  </div>

</div>
