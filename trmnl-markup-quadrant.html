<!-- QUADRANT VIEW (v19 - Full-Bleed Poster) -->
<div class="layout" style="padding: 0; position: relative; height: 100%; width: 100%; overflow: hidden; background-color: black;">
  
  <!-- Background Layer: Full 100% of quadrant -->
  <img class="image image-dither image--cover" src="{{ image_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.75;" />
  
  <!-- Centered Editorial Box -->
  <div class="flex flex--col flex--center" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; padding: 10px;">
    
    <!-- Adaptive Box (White 95% Opacity) -->
    <div style="background-color: rgba(255, 255, 255, 0.95); width: 90%; padding: 8px 12px; border: 2px solid black;">
      <div class="flex flex--col grow" style="text-align: left;">
        <!-- Title: Serif Bold Italic -->
        <div class="title title--base lg:title--large text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%;">{{ title }}</div>
        
        <!-- Description: Only on TRMNL X (lg) -->
        <div class="hidden lg:block lg:description--base text--black" style="font-family: serif; font-style: italic; line-height: 1.2; margin-top: 4px;">{{ description | truncate: 80 }}</div>
      </div>
    </div>
    
  </div>

  <!-- Branding Layer (Bottom Right) -->
  <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px; align-items: center; z-index: 3;">
    <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--20 lg:h--20" style="background: white; padding: 1px; border: 1px solid black;" />
    <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--20 lg:h--20" style="background: white; padding: 1px; border: 1px solid black;" />
  </div>

</div>
