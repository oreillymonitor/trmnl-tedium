<!-- QUADRANT VIEW (v40 - Unified Parity Final) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
  
  /* Targeted boldness for TRMNL X headlines */
  .lg .title--medium { font-weight: 900 !important; }
</style>

<div class="layout layout--col p--0 bg--white" style="height: 100%; border: 1px solid rgba(0,0,0,0.1); position: relative;">
  
  <!-- 1. STANDARD HARDWARE LAYOUT -->
  <div class="lg:hidden h--full w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />

    <!-- Unified Title Overlay -->
    <div class="flex flex--col flex--center p--3" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
      <div class="1bit:bg--white bg--red-30 p--3 border--1 border--solid 1bit:border--black border--white" style="width: 92%;">
        <div class="title title--base 1bit:text--black text--white pb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.4;">{{ title }}</div>
      </div>
    </div>

    <!-- Branding -->
    <div class="flex gap--small" style="position: absolute; bottom: 8px; right: 8px; z-index: 3;">
      <div class="bg--white p--1 w--20 h--20 no-shrink border--1 border--solid border--black">
        <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
      </div>
      <div class="bg--white p--1 w--20 h--20 no-shrink border--1 border--solid border--black">
        <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
      </div>
    </div>
  </div>

  <!-- 2. TRMNL X HARDWARE LAYOUT -->
  <div class="hidden lg:flex flex--col h--full w--full bg--white">
    <!-- Image Top (70%) -->
    <div class="h--[70cqh] w--full overflow--hidden no-shrink bg--black" style="position: relative;">
      <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%;" />
      
      <!-- Title Box on Image -->
      <div class="flex flex--col flex--center p--3" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;">
        <div class="bg--white p--3 border--2 border--solid border--black" style="width: 90%;">
          <div class="title title--medium text--black pb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.4;">{{ title }}</div>
        </div>
      </div>

      <!-- Branding Overlay -->
      <div class="flex gap--small" style="position: absolute; bottom: 8px; right: 8px; z-index: 3;">
        <div class="bg--white p--1 w--32 h--32 no-shrink border--1 border--solid border--black">
          <img src="{{ logo_url }}" class="image image-dither" style="display: block; width: 100%; height: 100%;" />
        </div>
        <div class="bg--white p--1 w--32 h--32 no-shrink border--1 border--solid border--black">
          <img src="{{ qr_url }}" class="image" style="display: block; width: 100%; height: 100%;" />
        </div>
      </div>
    </div>

    <!-- Content Bottom (30%) -->
    <div class="flex flex--col grow p--3 justify--top bg--white text--left">
      <div class="title title--small text--black mb--1 pb--1" style="font-family: 'Besley', serif; font-style: italic; font-weight: bold; line-height: 1.4;">{{ archive_date }}</div>
      <div class="description description--large text--black pb--2" style="font-family: 'Besley', serif; font-style: italic; line-height: 1.4;">{{ description }}</div>
    </div>
  </div>

</div>
