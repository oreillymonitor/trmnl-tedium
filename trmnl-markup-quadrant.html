<!-- QUADRANT VIEW (Compact Spacing & Content Focused) -->
<div class="layout layout--col bg--white p--0" style="height: 100%; border: 1px solid rgba(0,0,0,0.1);">
  
  <!-- Image Area: 70% on standard, 50% on LG (X) -->
  <div class="h--[70cqh] lg:h--[50cqh] w--full overflow--hidden no-shrink" style="position: relative;">
    <img class="image image-dither image--cover" src="{{ image_url }}" style="height: 100%; width: 100%; opacity: {{ image_opacity | default: 0.8 }};" />
    
    <!-- Branding Overlay (Bottom Right of Image) -->
    <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 8px; z-index: 2;">
      <img src="{{ logo_url }}" class="image image-dither w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
      <img src="{{ qr_url }}" class="image w--12 h--12 lg:w--24 lg:h--24" style="background: white; padding: 2px; border: 1px solid black;" />
    </div>
  </div>

  <!-- Content Area: Top-aligned to image with space at bottom -->
  <div class="flex flex--col grow p--2 lg:p--4 justify--top" style="text-align: left; height: 100%;">
    
    <!-- Title: Directly beneath picture -->
    <div class="title title--base lg:title--medium text--black" style="font-family: serif; font-style: italic; font-weight: bold; line-height: 1.1; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">{{ title }}</div>
    
    <!-- Description: Larger for X (lg), hidden for standard -->
    <div class="hidden lg:block lg:description--large text--black" style="font-family: serif; font-style: italic; line-height: 1.2; margin-top: 8px;">{{ description | truncate: 120 }}</div>
    
    <!-- Remaining space stays at the bottom -->
    <div class="grow"></div>
  </div>
</div>
